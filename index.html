<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08111f" />
    <meta name="description" content="CoinSwift is a simple crypto trading and portfolio demo." />
    <title>CoinSwift - Buy & Sell Crypto</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0f172a;
        color: white;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a; 
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569; 
      }
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; background: #08111f; }
      button, input, select { font: inherit; }
      button, a { cursor: pointer; }
      a { color: inherit; text-decoration: none; }
      .app { min-height: 100vh; display: flex; flex-direction: column; }
      .main { flex: 1; }
      .topbar { height: 72px; border-bottom: 1px solid #1b2a40; background: rgba(8,17,31,.94); position: sticky; top: 0; z-index: 20; backdrop-filter: blur(14px); }
      .nav-wrap { max-width: 1180px; height: 100%; margin: auto; padding: 0 24px; display: flex; align-items: center; }
      .brand { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 750; letter-spacing: -.5px; }
      .brand-mark { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: white; background: linear-gradient(135deg,#5aa2ff,#2764db); box-shadow: 0 8px 24px rgba(59,130,246,.25); }
      .nav-links { display: flex; align-items: center; gap: 34px; margin-left: 62px; }
      .nav-links a { color: #98a6ba; font-size: 14px; font-weight: 600; transition: .2s; }
      .nav-links a:hover, .nav-links a.active { color: white; }
      .nav-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
      .icon-button { width: 38px; height: 38px; border: 0; border-radius: 8px; color: #b4c0cf; background: transparent; display: grid; place-items: center; }
      .icon-button:hover { background: #162338; }
      .login-link { color: #cbd5e1; font-size: 14px; font-weight: 600; padding: 10px 12px; }
      .primary-small { border: 0; border-radius: 8px; background: #3b82f6; color: white; min-height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px; font-size: 14px; font-weight: 700; }
      .menu-button { display: none; }
      .hero { max-width: 1180px; margin: auto; min-height: 520px; padding: 84px 24px 70px; display: grid; grid-template-columns: 1fr 1fr; gap: 70px; align-items: center; }
      .eyebrow, .section-kicker { color: #72a9ff; font-size: 12px; font-weight: 800; letter-spacing: 1.4px; }
      .eyebrow { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px; }
      .hero h1, .page-heading h1 { margin: 0 0 18px; font-size: clamp(44px,6vw,68px); line-height: 1.02; letter-spacing: -3.5px; }
      .hero-copy p { max-width: 520px; color: #9ba9bd; font-size: 18px; line-height: 1.65; margin: 0 0 28px; }
      .hero-actions { display: flex; gap: 12px; }
      .primary-button, .secondary-button { height: 48px; padding: 0 22px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; font-weight: 750; font-size: 14px; }
      .primary-button { background: #3b82f6; }
      .primary-button:hover { background: #4b8df7; }
      .secondary-button { border: 1px solid #2a3b53; background: #101c2d; }
      .trust-row { display: flex; align-items: center; gap: 9px; color: #8090a5; margin-top: 28px; font-size: 13px; }
      .trust-row svg { color: #63a2ff; }
      .dot { width: 3px; height: 3px; border-radius: 50%; background: #526178; }
      .hero-card, .chart-card, .order-card { background: linear-gradient(145deg,#111f32,#0d1828); border: 1px solid #20324a; border-radius: 16px; box-shadow: 0 24px 60px rgba(0,0,0,.25); }
      .hero-card { padding: 24px 24px 14px; transform: rotate(.5deg); }
      .hero-card-head { display: flex; justify-content: space-between; color: #7f8fa5; }
      .hero-card-head div { display: flex; flex-direction: column; gap: 7px; }
      .hero-card-head strong { color: white; font-size: 28px; }
      .chart { height: 180px; margin-top: 18px; }
      .chart svg, .large-chart svg { width: 100%; height: 100%; }
      .chart-grid { stroke: #223247; stroke-width: 1; stroke-dasharray: 5 7; }
      .chart-legend { display: flex; justify-content: space-between; color: #66778d; font-size: 11px; }
      .market-section, .feature-grid { max-width: 1180px; margin: auto; padding: 55px 24px; }
      .market-section { padding-top: 20px; }
      .section-heading { display: flex; align-items: end; justify-content: space-between; margin-bottom: 22px; }
      .section-heading h2 { margin: 7px 0 0; font-size: 30px; letter-spacing: -1px; }
      .section-heading a { color: #72a9ff; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; }
      .coin-table { border: 1px solid #1c2b40; border-radius: 12px; overflow: hidden; background: #0c1726; }
      .table-head, .table-row { display: grid; grid-template-columns: 2fr 1fr 1fr .7fr; align-items: center; min-height: 72px; padding: 0 22px; }
      .table-head { min-height: 42px; color: #6d7d92; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #1c2b40; }
      .table-row { border-bottom: 1px solid #18263a; transition: background .18s; }
      .table-row:last-child { border-bottom: 0; }
      a.table-row:hover { background: #101e30; }
      .asset { display: flex; align-items: center; gap: 12px; }
      .asset div { display: flex; flex-direction: column; gap: 3px; }
      .asset small { color: #738399; font-size: 12px; }
      .coin-icon { width: 40px; height: 40px; border-radius: 50%; display: inline-grid; place-items: center; color: white; font-weight: 800; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
      .coin-icon-small { width: 30px; height: 30px; flex: 0 0 30px; font-size: 12px; }
      .change { font-weight: 700; }
      .positive { color: #37d6a1 !important; }
      .negative { color: #ff7285 !important; }
      .trade-button { justify-self: end; height: 36px; min-width: 70px; border: 1px solid #294158; border-radius: 7px; background: #16273a; color: #d8e5f4; font-weight: 700; }
      .feature-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; padding-top: 20px; padding-bottom: 80px; }
      .feature-grid article { border: 1px solid #1b2a40; background: #0c1726; border-radius: 12px; padding: 28px; }
      .feature-icon { width: 42px; height: 42px; border-radius: 9px; display: grid; place-items: center; color: #78adff; background: #14253b; }
      .feature-icon svg { width: 20px; }
      .feature-grid h3 { margin: 20px 0 8px; }
      .feature-grid p { color: #8292a7; line-height: 1.6; margin: 0; }
      footer { border-top: 1px solid #1b2a40; }
      .footer-inner { max-width: 1180px; min-height: 110px; margin: auto; padding: 24px; display: flex; align-items: center; gap: 22px; color: #718198; }
      .muted-brand { color: white; }
      .footer-inner p { font-size: 13px; }
      .footer-links { margin-left: auto; display: flex; gap: 24px; font-size: 13px; }
      .page { max-width: 1180px; margin: auto; min-height: 680px; padding: 60px 24px 90px; }
      .page-heading { display: flex; justify-content: space-between; align-items: end; margin-bottom: 32px; }
      .page-heading h1 { font-size: 46px; margin: 8px 0 0; letter-spacing: -2px; }
      .market-search { width: 260px; height: 44px; border: 1px solid #26384d; background: #0d1928; border-radius: 8px; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: #718197; }
      .market-search input { width: 100%; border: 0; outline: 0; background: transparent; color: white; }
      .stats-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; margin-bottom: 18px; }
      .stats-grid article { height: 120px; border: 1px solid #1c2b40; background: #0c1726; border-radius: 10px; padding: 22px; display: grid; }
      .stats-grid article span { color: #8292a7; font-size: 13px; }
      .stats-grid article strong { font-size: 24px; }
      .stats-grid article small { color: #718198; }
      .full-table { margin-top: 18px; }
      .empty-state { height: 120px; display: grid; place-items: center; color: #8292a7; }
      .trade-page { max-width: 1180px; }
      .trade-market { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
      .trade-asset { display: flex; align-items: center; gap: 14px; }
      .trade-asset h1 { margin: 0 0 4px; font-size: 28px; }
      .trade-asset span { color: #7f8fa5; }
      .trade-price { display: flex; flex-direction: column; align-items: end; gap: 5px; }
      .trade-price strong { font-size: 26px; }
      .trade-layout { display: grid; grid-template-columns: minmax(0,1fr) 330px; gap: 16px; }
      .trade-layout > *, .chart-card { min-width: 0; }
      .chart-card { min-height: 430px; padding: 22px; overflow: hidden; }
      .card-heading { display: flex; justify-content: space-between; align-items: center; }
      .card-heading h2 { font-size: 16px; margin: 0; }
      .chart-subtitle { display: block; color: #74859b; font-size: 11px; margin-top: 5px; }
      .range-tabs { display: flex; gap: 4px; }
      .range-tabs button { border: 0; color: #7e8fa4; background: transparent; border-radius: 6px; height: 32px; width: 38px; }
      .range-tabs button.active { color: white; background: #1b2d43; }
      .large-chart { width: 100%; height: 340px; min-width: 0; padding-top: 24px; overflow: hidden; }
      .large-chart svg { display: block; width: 100%; height: 100%; overflow: hidden; }
      .chart-axis-label, .chart-time-label { fill: #74859b; font: 10px Inter, sans-serif; }
      .chart-time-label { font-size: 9px; letter-spacing: .8px; }
      .chart-current-guide { stroke: #4d8cff; stroke-width: 1; stroke-dasharray: 4 5; opacity: .42; vector-effect: non-scaling-stroke; }
      .chart-current-point { fill: #08111f; stroke: #79aaff; stroke-width: 3; vector-effect: non-scaling-stroke; }
      .order-card { height: fit-content; padding: 18px; }
      .trade-tabs { display: grid; grid-template-columns: 1fr 1fr; background: #091320; border-radius: 8px; padding: 4px; margin-bottom: 20px; }
      .trade-tabs button { height: 40px; border: 0; border-radius: 6px; background: transparent; color: #8b9aaf; font-weight: 700; }
      .trade-tabs button.active { background: #3b82f6; color: white; }
      .trade-tabs-three { grid-template-columns: repeat(3,1fr); }
      .trade-tabs button.ai-tab { display: flex; align-items: center; justify-content: center; gap: 5px; }
      .trade-tabs button.ai-active { background: linear-gradient(135deg,#8b5cf6,#5b67f1); color: white; display: flex; align-items: center; justify-content: center; gap: 5px; }
      .ai-recommendation { display: grid; }
      .ai-heading { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 10px; margin: 2px 0 18px; }
      .ai-brain { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: #c4b5fd; background: rgba(139,92,246,.16); border: 1px solid rgba(167,139,250,.18); }
      .ai-heading div { display: grid; gap: 3px; }
      .ai-heading div span { color: #8191a5; font-size: 11px; text-transform: uppercase; letter-spacing: .8px; }
      .ai-heading div strong { font-size: 15px; }
      .ai-live { border: 1px solid #4e3f73; border-radius: 5px; color: #a78bfa; font-size: 9px; font-weight: 800; padding: 4px 6px; letter-spacing: .7px; }
      .ai-select-label { margin-bottom: 12px !important; }
      .recommendation-result { border: 1px solid #26384d; border-radius: 10px; background: #091421; padding: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
      .recommendation-main { display: grid; gap: 5px; }
      .recommendation-main span, .confidence span { color: #8191a5; font-size: 11px; }
      .recommendation-main strong { color: #37d6a1; font-size: 22px; }
      .recommendation-hold .recommendation-main strong { color: #f3b95f; }
      .recommendation-wait .recommendation-main strong { color: #ff7285; }
      .confidence { display: grid; align-content: center; gap: 8px; }
      .confidence > div:first-child { display: flex; justify-content: space-between; }
      .confidence strong { font-size: 12px; }
      .confidence-track { height: 5px; border-radius: 5px; background: #1d2d40; overflow: hidden; }
      .confidence-track i { height: 100%; display: block; border-radius: 5px; background: linear-gradient(90deg,#7c5cff,#55a4ff); }
      .recommendation-details { border-left: 2px solid #6d78eb; background: rgba(83,105,190,.08); border-radius: 0 8px 8px 0; padding: 12px 14px; }
      .recommendation-details span { color: #c5cff1; font-size: 12px; font-weight: 800; }
      .recommendation-details p { color: #8797aa; font-size: 12px; line-height: 1.55; margin: 5px 0 0; }
      .risk-notice { display: flex; align-items: flex-start; gap: 8px; color: #718198; margin: 12px 0; }
      .risk-notice svg { flex: 0 0 16px; margin-top: 2px; color: #8494aa; }
      .risk-notice p { font-size: 10px; line-height: 1.45; margin: 0; }
      .order-card label, .auth-card label { display: grid; gap: 9px; color: #96a5b8; font-size: 13px; margin-bottom: 16px; }
      .select-wrap, .amount-input { height: 52px; border: 1px solid #27394f; background: #0a1523; border-radius: 8px; display: flex; align-items: center; padding: 0 10px; }
      .select-wrap select { flex: 1; border: 0; outline: 0; background: transparent; color: white; padding: 0 8px; }
      .amount-input span { color: #8393a7; font-size: 18px; }
      .amount-input input { width: 100%; border: 0; outline: 0; background: transparent; color: white; padding: 0 10px; font-size: 20px; font-weight: 700; }
      .order-summary { display: flex; justify-content: space-between; color: #8292a7; font-size: 13px; padding: 8px 0 18px; }
      .order-summary strong { color: white; }
      .place-order { width: 100%; height: 48px; border: 0; border-radius: 8px; background: #3b82f6; color: white; font-weight: 800; }
      .portfolio-summary { min-height: 180px; border: 1px solid #1c2b40; background: linear-gradient(135deg,#101d2f,#0b1725); border-radius: 12px; margin-bottom: 28px; padding: 30px; display: flex; justify-content: space-between; align-items: center; }
      .portfolio-summary > div:first-child { display: grid; gap: 7px; }
      .portfolio-summary span { color: #8797aa; }
      .portfolio-summary strong { font-size: 40px; letter-spacing: -1.5px; }
      .portfolio-summary small { font-size: 13px; }
      .portfolio-actions { display: flex; gap: 10px; }
      .portfolio-actions button { height: 44px; border: 1px solid #2a3c52; border-radius: 8px; background: #17263a; color: white; display: flex; align-items: center; gap: 8px; padding: 0 16px; font-weight: 700; }
      .allocation { width: 120px; height: 6px; border-radius: 6px; background: #1e2d40; display: block; overflow: hidden; }
      .allocation i { height: 100%; display: block; border-radius: 6px; background: #4d8cff; }
      .auth-page { min-height: 100vh; display: grid; place-items: center; position: relative; background: radial-gradient(circle at 50% 30%,#14243a 0,#08111f 52%); }
      .auth-brand { position: absolute; top: 24px; left: max(24px,calc((100vw - 1180px)/2)); }
      .auth-card { width: min(420px,calc(100% - 32px)); border: 1px solid #203149; border-radius: 16px; background: #0d1928; padding: 34px; box-shadow: 0 30px 80px rgba(0,0,0,.35); text-align: center; }
      .auth-icon { width: 54px; height: 54px; border-radius: 50%; background: #162940; color: #66a2ff; display: inline-grid; place-items: center; }
      .auth-card h1 { margin: 18px 0 8px; font-size: 28px; }
      .auth-card > p { color: #8797aa; margin: 0 0 24px; font-size: 14px; }
      .auth-card label { text-align: left; }
      .auth-card input { height: 48px; width: 100%; border: 1px solid #27394f; border-radius: 8px; background: #091320; color: white; outline: 0; padding: 0 12px; }
      .auth-card input:focus { border-color: #4d8cff; }
      .password-field { position: relative; }
      .password-field button { position: absolute; right: 8px; top: 8px; width: 32px; height: 32px; border: 0; background: transparent; color: #8191a5; display: grid; place-items: center; }
      .auth-submit { margin-top: 4px; }
      .auth-switch { color: #7d8da1; margin-top: 18px; font-size: 13px; }
      .auth-switch a { color: #72a9ff; font-weight: 700; }
      .auth-message { border-radius: 8px; margin: -4px 0 14px; padding: 10px 12px; text-align: left; font-size: 12px; line-height: 1.45; }
      .auth-error { border: 1px solid rgba(255,114,133,.28); background: rgba(255,114,133,.08); color: #ff9aa7; }
      .auth-success { border: 1px solid rgba(55,214,161,.28); background: rgba(55,214,161,.08); color: #69dfb6; }
      .demo-credentials { margin: -2px 0 14px; color: #718198; font-size: 11px; }
      .demo-credentials strong { color: #a8b6c8; }
      .account-button { height: 38px; border: 0; border-radius: 8px; background: #142238; color: #d7e2f1; display: inline-flex; align-items: center; gap: 7px; padding: 0 10px; font-size: 13px; font-weight: 700; }
      .search-overlay { position: fixed; inset: 72px 0 0; z-index: 30; background: rgba(3,8,16,.72); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: flex-start; padding-top: 28px; }
      .search-modal { width: min(560px,calc(100% - 32px)); border: 1px solid #26384d; border-radius: 12px; background: #0d1928; padding: 12px; box-shadow: 0 30px 80px rgba(0,0,0,.45); }
      .modal-search { width: 100%; }
      .modal-search button { border: 0; background: transparent; color: #8191a5; display: grid; place-items: center; }
      .search-results { display: grid; padding-top: 8px; }
      .search-results button { min-height: 58px; border: 0; border-bottom: 1px solid #1a2940; background: transparent; color: white; display: grid; grid-template-columns: 36px 1fr auto; align-items: center; gap: 10px; text-align: left; padding: 8px; }
      .search-results button:last-child { border-bottom: 0; }
      .search-results button:hover { background: #111f30; border-radius: 8px; }
      .search-results button span { display: grid; gap: 3px; }
      .search-results small { color: #718198; }
      .search-results b { font-size: 13px; }
      .search-results p { color: #718198; text-align: center; }
      .order-message, .portfolio-message { border: 1px solid rgba(255,114,133,.25); border-radius: 8px; background: rgba(255,114,133,.07); color: #ff9aa7; font-size: 12px; line-height: 1.45; padding: 9px 10px; margin: 0 0 12px; }
      .order-success { border-color: rgba(55,214,161,.25); background: rgba(55,214,161,.07); color: #69dfb6; }
      .portfolio-message { margin: -14px 0 18px; max-width: 420px; }
      .not-found { min-height: calc(100vh - 182px); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 20px; }
      .not-found > span { color: #4d8cff; font-size: 13px; font-weight: 800; letter-spacing: 3px; }
      .not-found h1 { margin: 12px 0 8px; font-size: 42px; }
      .not-found p { color: #8292a7; margin: 0 0 24px; }
      @media (max-width: 850px) {
        .nav-links { display: none; position: absolute; top: 72px; left: 0; right: 0; margin: 0; padding: 20px 24px; background: #0b1625; border-bottom: 1px solid #1b2a40; }
        .nav-links.nav-open { display: grid; gap: 18px; }
        .menu-button { display: grid; }
        .search-button, .login-link { display: none; }
        .hero { grid-template-columns: 1fr; gap: 40px; padding-top: 54px; }
        .hero h1 { font-size: 50px; }
        .feature-grid { grid-template-columns: 1fr; }
        .trade-layout { grid-template-columns: minmax(0,1fr); }
        .stats-grid { grid-template-columns: 1fr 1fr; }
      }
      @media (max-width: 600px) {
        .nav-wrap { padding: 0 16px; }
        .primary-small { min-height: 38px; padding: 0 12px; }
        .hero { padding: 42px 16px 50px; }
        .hero h1 { font-size: 44px; letter-spacing: -2.5px; }
        .hero-copy p { font-size: 16px; }
        .hero-card { margin: 0 -4px; }
        .market-section, .feature-grid { padding-left: 16px; padding-right: 16px; }
        .table-head { display: none; }
        .table-row { grid-template-columns: 1.7fr 1fr .8fr; min-height: 74px; padding: 0 12px; }
        .table-row .trade-button { display: none; }
        .coin-icon { width: 36px; height: 36px; }
        .section-heading h2 { font-size: 26px; }
        .page { padding: 40px 16px 70px; }
        .page-heading { align-items: flex-start; gap: 16px; }
        .page-heading h1 { font-size: 36px; }
        .market-search { width: 180px; }
        .stats-grid { grid-template-columns: 1fr; }
        .trade-market { align-items: flex-start; }
        .trade-price strong { font-size: 18px; }
        .chart-card { min-height: 320px; }
        .large-chart { height: 250px; }
        .portfolio-summary { align-items: flex-start; gap: 24px; flex-direction: column; }
        .portfolio-summary strong { font-size: 32px; }
        .full-table .table-row { grid-template-columns: 1.5fr 1fr .8fr; }
        .full-table .table-row > :last-child { display: none; }
        .footer-inner { align-items: flex-start; flex-direction: column; }
        .footer-links { margin: 0; }
      }
    </style>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
